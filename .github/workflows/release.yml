name: Windows release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check release version
        id: version
        run: node scripts/release-info.cjs
      - name: Install dependencies
        if: steps.version.outputs.publish == 'true'
        run: npm ci
      - name: Test
        if: steps.version.outputs.publish == 'true'
        run: npm test
      - name: Build Windows installer and portable EXE
        if: steps.version.outputs.publish == 'true'
        run: npm run dist
      - name: Verify release files
        if: steps.version.outputs.publish == 'true'
        run: node scripts/verify-release.cjs
      - name: Publish complete GitHub Release
        if: steps.version.outputs.publish == 'true'
        run: node scripts/publish-release.cjs
